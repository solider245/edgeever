<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 1200 500"><title id="title">Cloudflare User API Token permissions for EdgeEver Workers Builds</title><desc id="desc">A redacted Cloudflare Create Custom Token form. It selects Account Workers Builds Configuration Edit and Account Workers Scripts Read.</desc><rect width="1200" height="500" fill="#f7f8fa"/><rect width="1060" height="410" x="70" y="42" fill="#fff" stroke="#d8dde5" rx="10"/><text x="120" y="100" fill="#1d2733" font-family="Arial, sans-serif" font-size="28" font-weight="700">Create Custom Token</text><text x="120" y="145" fill="#4a5565" font-family="Arial, sans-serif" font-size="16">Token name</text><rect width="700" height="44" x="120" y="160" fill="#fff" stroke="#8a96a8" rx="5"/><text x="136" y="189" fill="#273142" font-family="Arial, sans-serif" font-size="17">edgeever automated deployment</text><text x="120" y="250" fill="#1d2733" font-family="Arial, sans-serif" font-size="22" font-weight="700">Permissions</text><text x="120" y="281" fill="#4a5565" font-family="Arial, sans-serif" font-size="15">Select only these two Account permissions.</text><g fill="#273142" font-family="Arial, sans-serif" font-size="16"><rect width="170" height="46" x="120" y="305" fill="#fff" stroke="#8a96a8" rx="5"/><text x="137" y="334">Account</text><rect width="420" height="46" x="304" y="305" fill="#fff" stroke="#8a96a8" rx="5"/><text x="321" y="334">Workers Builds Configuration</text><rect width="150" height="46" x="738" y="305" fill="#eef7f4" stroke="#159570" rx="5"/><text x="755" y="334" fill="#087257">Edit</text><rect width="170" height="46" x="120" y="367" fill="#fff" stroke="#8a96a8" rx="5"/><text x="137" y="396">Account</text><rect width="420" height="46" x="304" y="367" fill="#fff" stroke="#8a96a8" rx="5"/><text x="321" y="396">Workers Scripts</text><rect width="150" height="46" x="738" y="367" fill="#eef7f4" stroke="#159570" rx="5"/><text x="755" y="396" fill="#087257">Read</text></g><text x="926" y="333" fill="#687386" font-family="Arial, sans-serif" font-size="15">User API Token</text><text x="926" y="394" fill="#687386" font-family="Arial, sans-serif" font-size="15">not Account API Token</text></svg>